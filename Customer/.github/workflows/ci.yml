name: GONGO Customer Backend CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality, Tests & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies Deterministically
        run: npm ci

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Dependency Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Execute Full Jest Regression Suite
        run: npm test

      - name: Execute Load & Concurrency Benchmark
        run: npm run test:load

  docker:
    name: Container Build & Health Validation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gongo-customer-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
